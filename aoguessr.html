<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>AoGuessr - アオゲッサー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0f2d25;
    --forest-deep:#081b16;
    --forest-2:#17453a;
    --cream:#f5efe0;
    --apple:#d63c35;
    --apple-dark:#b12b25;
    --leaf:#5aa66b;
    --p1:#3d8bfd;
    --p2:#f0871f;
    --p1-soft:#9cc4f8;
    --p2-soft:#f7bd85;
    --line:rgba(245,239,224,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-weight:500;
    background:radial-gradient(120% 90% at 50% 0%, var(--forest-2) 0%, var(--forest) 45%, var(--forest-deep) 100%);
    background-attachment:fixed;
    color:var(--cream);
  }
  button{font-family:inherit;cursor:pointer;border:none}
  .disp{font-family:"RocknRoll One","Zen Maru Gothic",sans-serif;font-weight:400}

  /* ---------- 起動画面 ---------- */
  #setup{
    min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:36px 20px 120px;position:relative;overflow:hidden;
  }
  #mtIwaki{
    position:fixed;left:0;right:0;bottom:0;width:100%;height:150px;z-index:0;
    pointer-events:none;opacity:.9;
  }
  #setup > *{position:relative;z-index:1}
  #heroMap{position:relative;width:230px;margin-bottom:4px}
  #aomoriShape{width:100%;display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))}
  #logoPin{
    position:absolute;left:85px;top:41px;width:46px;height:60px;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #setup h1{
    margin-top:6px;font-size:clamp(42px,10vw,72px);letter-spacing:.02em;line-height:1.05;text-align:center;
  }
  #setup h1 span{color:#ef5d55}
  #setup .sub{margin-top:6px;font-size:13px;opacity:.8;text-align:center;letter-spacing:.45em;padding-left:.45em}
  .panel{
    margin-top:26px;width:min(470px,100%);
    background:rgba(23,69,58,.66);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:16px;
    padding:22px 20px;display:flex;flex-direction:column;gap:16px;
    box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  .field label{display:block;font-size:12px;margin-bottom:7px;opacity:.85;letter-spacing:.08em}
  .field input[type=text]{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:rgba(8,27,22,.8);color:var(--cream);font-size:14px;font-family:inherit;
  }
  .field input[type=text]:focus{outline:2px solid var(--leaf);border-color:transparent}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);
    background:transparent;color:var(--cream);font-size:14px;font-weight:700;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--cream)}
  .chip.on{background:var(--cream);color:var(--forest);border-color:var(--cream);box-shadow:0 3px 10px rgba(0,0,0,.3)}
  #nameFields{display:none;gap:10px}
  #nameFields input{flex:1;min-width:0}
  #startBtn{
    margin-top:6px;padding:15px;border-radius:12px;
    background:linear-gradient(180deg,#e14a42,var(--apple-dark));
    color:#fff;font-size:18px;font-weight:900;letter-spacing:.12em;
    box-shadow:0 6px 0 #7e1d19, 0 10px 18px rgba(0,0,0,.35);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  #startBtn:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 #7e1d19,0 4px 10px rgba(0,0,0,.35)}
  #startBtn:disabled{opacity:.55;cursor:wait}
  #setupErr{display:none;color:#ffb3b1;font-size:13px;line-height:1.6}
  .note{margin-top:22px;font-size:11.5px;opacity:.6;line-height:1.9;width:min(470px,100%)}

  /* ---------- ゲーム画面 ---------- */
  #game{position:fixed;inset:0;display:none;background:var(--forest-deep)}
  #pano{position:absolute;inset:0}
  #timerWrap{position:absolute;top:0;left:0;right:0;height:8px;z-index:6;background:rgba(0,0,0,.4);display:none}
  #timerFill{height:100%;width:100%;background:var(--cream);transition:background .3s}
  #timerFill.hurry{background:var(--apple);box-shadow:0 0 12px rgba(214,60,53,.9)}
  #hud{
    position:absolute;top:16px;left:12px;z-index:5;
    background:rgba(8,27,22,.82);backdrop-filter:blur(4px);
    border:1px solid var(--line);border-radius:999px;
    padding:9px 18px;font-size:13px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    max-width:calc(100vw - 190px);
  }
  #hud b{font-size:15px}
  .hudP1{color:var(--p1-soft)}.hudP2{color:var(--p2-soft)}
  #topRight{position:absolute;top:16px;right:12px;z-index:5;display:flex;gap:6px}
  #topRight button{
    background:rgba(8,27,22,.82);backdrop-filter:blur(4px);
    border:1px solid var(--line);border-radius:999px;
    color:var(--cream);padding:9px 13px;font-size:12.5px;font-weight:700;
  }
  #topRight button:active{transform:translateY(1px)}
  #mapBox{
    position:absolute;right:12px;bottom:12px;z-index:5;
    width:250px;height:190px;border-radius:14px;overflow:hidden;
    border:2px solid rgba(8,27,22,.92);box-shadow:0 8px 24px rgba(0,0,0,.5);
    transition:width .18s ease,height .18s ease;
    display:flex;flex-direction:column;background:var(--forest-2);
  }
  #mapBox.big{width:min(78vw,640px);height:min(60vh,480px)}
  #guessMap{flex:1}
  #sizeBtn{
    position:absolute;top:6px;left:6px;z-index:6;width:32px;height:32px;
    border-radius:8px;background:rgba(8,27,22,.85);color:var(--cream);font-size:15px;
  }
  #guessBtn{
    height:46px;background:linear-gradient(180deg,#e14a42,var(--apple-dark));
    color:#fff;font-size:15px;font-weight:900;letter-spacing:.08em;
  }
  #guessBtn:disabled{background:#3d4d48;color:#b9c2be;cursor:default}
  #loading{
    position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%, var(--forest-2), var(--forest-deep));
    font-size:15px;letter-spacing:.05em;text-align:center;padding:20px;line-height:2;
  }
  .spinner{
    width:44px;height:44px;border-radius:50%;
    border:4px solid rgba(245,239,224,.2);border-top-color:var(--apple);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 交代・スタート画面 ---------- */
  #ready{
    position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, var(--forest-2), var(--forest-deep));
  }
  #ready.glow1{background:radial-gradient(100% 80% at 50% 20%, rgba(61,139,253,.28), var(--forest-deep) 70%)}
  #ready.glow2{background:radial-gradient(100% 80% at 50% 20%, rgba(240,135,31,.28), var(--forest-deep) 70%)}
  #readyRound{font-size:14px;letter-spacing:.3em;padding-left:.3em;opacity:.8}
  #readyName{font-size:38px}
  #readyName.c1{color:var(--p1-soft)}#readyName.c2{color:var(--p2-soft)}
  #readyNote{font-size:13px;opacity:.78;line-height:2}
  #readyBtn{
    margin-top:12px;padding:15px 64px;border-radius:12px;
    background:linear-gradient(180deg,#e14a42,var(--apple-dark));
    color:#fff;font-size:18px;font-weight:900;letter-spacing:.14em;
    box-shadow:0 6px 0 #7e1d19,0 10px 18px rgba(0,0,0,.35);
  }
  #readyBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7e1d19}

  /* ---------- ラウンド結果 ---------- */
  #result{position:fixed;inset:0;display:none;flex-direction:column;background:var(--forest-deep)}
  #resultMap{flex:1}
  #resultPanel{
    padding:16px 20px calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:9px;align-items:center;
    background:linear-gradient(180deg, var(--forest), var(--forest-deep));
    border-top:1px solid var(--line);
  }
  .scoreRow{width:min(460px,100%);display:flex;align-items:center;gap:10px;font-size:14px}
  .scoreRow .pn{width:6.5em;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scoreRow.r1 .pn{color:var(--p1-soft)}.scoreRow.r2 .pn{color:var(--p2-soft)}
  .scoreRow .dist{width:6em;text-align:right;opacity:.9}
  .scoreRow .bar{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden}
  .scoreRow .fill{height:100%;width:0;background:var(--apple);transition:width .8s ease;border-radius:5px}
  .scoreRow.r1 .fill{background:var(--p1)}
  .scoreRow.r2 .fill{background:var(--p2)}
  .scoreRow .pts{width:4.8em;text-align:right;font-size:17px}
  #nextBtn{
    margin-top:8px;padding:13px 48px;border-radius:12px;background:var(--cream);
    color:var(--forest);font-size:16px;font-weight:900;letter-spacing:.06em;
    box-shadow:0 5px 0 #b7ac93,0 9px 16px rgba(0,0,0,.35);
  }
  #nextBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b7ac93}

  /* ---------- 最終結果 ---------- */
  #final{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;padding:24px;overflow:auto;
    background:radial-gradient(120% 90% at 50% 0%, var(--forest-2), var(--forest-deep));
  }
  #final h2{font-size:15px;letter-spacing:.35em;padding-left:.35em;opacity:.8}
  #crown{font-size:44px;line-height:1}
  #winner{font-size:32px;text-align:center;line-height:1.4}
  #finalTotals{display:flex;gap:34px;font-size:15px;text-align:center}
  #finalTotals b{display:block;font-size:36px;font-family:"RocknRoll One",sans-serif;font-weight:400}
  #finalTotals .t1 b{color:var(--p1-soft)}#finalTotals .t2 b{color:var(--p2-soft)}
  #finalList{width:min(470px,100%);border-top:1px solid var(--line);font-size:13px}
  #finalList div{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
  #againBtn{
    padding:14px 52px;border-radius:12px;
    background:linear-gradient(180deg,#e14a42,var(--apple-dark));color:#fff;
    font-size:16px;font-weight:900;letter-spacing:.08em;
    box-shadow:0 6px 0 #7e1d19,0 10px 18px rgba(0,0,0,.35);
  }
  #againBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7e1d19}
  #toTitleBtn{background:none;color:var(--cream);font-size:13px;text-decoration:underline;opacity:.75}

  #confetti{position:fixed;inset:0;z-index:99;pointer-events:none;display:none}

  @media (max-width:640px){
    #mapBox{width:170px;height:150px}
    #mapBox.big{width:calc(100vw - 24px);height:52vh}
    #hud{font-size:11px;padding:8px 12px;gap:9px;max-width:calc(100vw - 150px)}
    #hud b{font-size:13px}
    .scoreRow .pn{width:5em}
    #mtIwaki{height:110px}
  }
</style>
</head>
<body>

<!-- 起動画面 -->
<div id="setup">
  <div id="heroMap">
    <svg id="aomoriShape" viewBox="0 0 200 160" aria-hidden="true">
      <path d="M49 39 L82 63 L94 88 L105 74 L120 90 L137 85 L133 59 L139 42 L118 48 L97 51 L100 29 L111 6 L140 10 L172 19 L167 74 L172 100 L183 122 L191 131 L144 150 L111 138 L80 135 L30 140 L6 112 L20 95 L44 86 L47 68 L42 50 Z"
        fill="#1c4d40" stroke="rgba(245,239,224,.4)" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
    <svg id="logoPin" viewBox="0 0 64 84" aria-hidden="true">
      <path d="M32 80 C20 60 7 48 7 30 A25 25 0 1 1 57 30 C57 48 44 60 32 80 Z" fill="#d63c35"/>
      <path d="M32 80 C20 60 7 48 7 30 A25 25 0 0 1 32 5 L32 80 Z" fill="#e14a42"/>
      <circle cx="32" cy="30" r="10.5" fill="#f5efe0"/>
      <path d="M32 9 C31 4 28 2 25 1 C29 0 34 2 34 8 Z" fill="#7a4a2b"/>
      <path d="M34 8 C40 2 47 3 50 6 C46 11 38 12 34 8 Z" fill="#5aa66b"/>
    </svg>
  </div>
  <h1 class="disp"><span>Ao</span>Guessr</h1>
  <p class="sub">アオゲッサー</p>
  <div class="panel">
    <div class="field">
      <label for="keyInput">Google Maps APIキー</label>
      <input type="text" id="keyInput" placeholder="AIza..." autocomplete="off">
    </div>
    <div class="field">
      <label>あそびかた</label>
      <div class="row" id="modeChips">
        <button class="chip on" data-mode="solo">ひとりで</button>
        <button class="chip" data-mode="duel">ふたりで対戦</button>
      </div>
    </div>
    <div class="field" id="nameFieldWrap" style="display:none">
      <label>プレイヤー名</label>
      <div class="row" id="nameFields" style="display:flex">
        <input type="text" id="name1" placeholder="プレイヤー1" maxlength="8">
        <input type="text" id="name2" placeholder="プレイヤー2" maxlength="8">
      </div>
    </div>
    <div class="field">
      <label>ラウンド数</label>
      <div class="row" id="roundChips">
        <button class="chip" data-r="3">3</button>
        <button class="chip on" data-r="5">5</button>
        <button class="chip" data-r="10">10</button>
      </div>
    </div>
    <div class="field">
      <label>制限時間（1人あたり）</label>
      <div class="row" id="timeChips">
        <button class="chip on" data-t="0">なし</button>
        <button class="chip" data-t="30">30秒</button>
        <button class="chip" data-t="60">60秒</button>
        <button class="chip" data-t="120">2分</button>
      </div>
    </div>
    <div class="field">
      <label>移動</label>
      <div class="row" id="moveChips">
        <button class="chip on" data-m="1">移動あり</button>
        <button class="chip" data-m="0">その場から動けない</button>
      </div>
    </div>
    <button id="startBtn">プレイ開始</button>
    <p id="setupErr"></p>
  </div>
  <p class="note">
    青森県内のどこかに降り立ち、景色を手がかりに地図で場所を当てるゲームです。
    1ラウンド最大5,000pt。対戦では同じ地点を2人が順番にプレイし、合計点で勝負します。
  </p>
  <svg id="mtIwaki" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 150 L0 120 L180 110 L340 60 L430 95 L520 30 L600 80 L690 22 L800 90 L900 70 L1050 115 L1200 105 L1200 150 Z"
      fill="#081b16" opacity=".85"/>
    <path d="M0 150 L0 135 L250 125 L460 85 L620 118 L820 78 L1000 122 L1200 118 L1200 150 Z"
      fill="#050f0c"/>
  </svg>
</div>

<!-- ゲーム画面 -->
<div id="game">
  <div id="pano"></div>
  <div id="timerWrap"><div id="timerFill"></div></div>
  <div id="hud"></div>
  <div id="topRight">
    <button id="sfxBtn" title="効果音">♪</button>
    <button id="bgmBtn" title="BGM">♫</button>
    <button id="backBtn">出発地点</button>
    <button id="titleBtn">タイトル</button>
  </div>
  <div id="mapBox">
    <button id="sizeBtn" title="地図の拡大/縮小">⤢</button>
    <div id="guessMap"></div>
    <button id="guessBtn" disabled>地図をタップして回答</button>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loadingText">青森県内の出題地点を探しています…</div></div>
</div>

<!-- 交代・スタート画面 -->
<div id="ready">
  <div id="readyRound"></div>
  <div id="readyName" class="disp"></div>
  <p id="readyNote"></p>
  <button id="readyBtn">スタート</button>
</div>

<!-- ラウンド結果 -->
<div id="result">
  <div id="resultMap"></div>
  <div id="resultPanel"></div>
</div>

<!-- 最終結果 -->
<div id="final">
  <h2>最終結果</h2>
  <div id="crown"></div>
  <div id="winner" class="disp"></div>
  <div id="finalTotals"></div>
  <div id="finalList"></div>
  <button id="againBtn">もう一度あそぶ</button>
  <button id="toTitleBtn">タイトルへもどる</button>
</div>

<canvas id="confetti"></canvas>

<script>
"use strict";

/* ▼▼ 公開用設定 ▼▼
   GitHubに置くときは、下の "" の間にAPIキーを貼り付けてください。
   例: const EMBEDDED_KEY = "AIzaXXXXXXXX";
   ここが空のままなら、起動画面でキーを入力する方式で動きます。 */
const EMBEDDED_KEY = "";
/* ▲▲ 書き換えるのはここだけです ▲▲ */

/* ===== 出題エリア（青森県の陸地をおおまかに覆う矩形群。海・県外は引き直し） ===== */
const REGIONS = [
  {latMin:40.60, latMax:41.15, lngMin:140.05, lngMax:140.60, w:3}, // 津軽平野・西海岸
  {latMin:40.60, latMax:41.00, lngMin:140.60, lngMax:141.05, w:3}, // 青森市・東津軽
  {latMin:40.35, latMax:40.95, lngMin:141.05, lngMax:141.60, w:4}, // 八戸・十和田・三沢・上北
  {latMin:41.15, latMax:41.45, lngMin:140.95, lngMax:141.40, w:2}, // 下北半島
  {latMin:40.40, latMax:40.60, lngMin:140.75, lngMax:141.05, w:1}, // 十和田湖・奥入瀬方面
  {latMin:41.00, latMax:41.30, lngMin:140.30, lngMax:140.70, w:1}  // 五所川原北部・竜飛方面
];
const REGION_W_TOTAL = REGIONS.reduce((s,r)=>s+r.w,0);
const BOUNDS = {latMin:40.20, latMax:41.60, lngMin:139.80, lngMax:141.75};

/* ===== 状態 ===== */
const S = {
  key:"", rounds:5, allowMove:true, timeLimit:0, mode:"solo",
  names:["プレイヤー1","プレイヤー2"], sound:true, bgm:true,
  round:0, player:0, totals:[0,0], history:[],
  panorama:null, guessMap:null, guessMarker:null,
  answer:null, startPanoId:null, startPov:null,
  svService:null, mapsReady:false, lastStatus:null,
  timerId:null, timeLeft:0, turnDone:false, inGame:false, ac:null
};
const nPlayers = ()=> S.mode==="duel" ? 2 : 1;

const $ = id => document.getElementById(id);
const show = (id,on)=>{ $(id).style.display = on ? (id==="game" ? "block" : "flex") : "none"; };

/* ===== 効果音（WebAudio・外部ファイル不要） ===== */
function ensureAudio(){
  if(!S.ac){
    try{ S.ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(S.ac && S.ac.state === "suspended") S.ac.resume();
}
function beep(freq, dur, delay, type, vol){
  if(!S.sound || !S.ac) return;
  const t = S.ac.currentTime + (delay||0);
  const o = S.ac.createOscillator(), g = S.ac.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(S.ac.destination);
  o.start(t); o.stop(t+dur);
}
const sfx = {
  start:  ()=>{ beep(440,.12,0,"triangle"); beep(660,.15,.10,"triangle"); },
  confirm:()=>{ beep(660,.09,0,"square",.08); beep(880,.14,.08,"square",.08); },
  tick:   ()=> beep(1200,.03,0,"square",.05),
  clock:  (hurry)=> beep(hurry?1150:850, .035, 0, "square", hurry?.07:.035),
  fanfare:()=>{ [523,659,784,1047].forEach((f,i)=> beep(f,.22,i*.13,"triangle",.14)); },
  bad:    ()=> beep(170,.35,0,"sawtooth",.10),
  win:    ()=>{ [392,523,659,784,1047].forEach((f,i)=> beep(f,.25,i*.14,"triangle",.14)); }
};

/* ===== BGM（津軽風・五音音階のつま弾きループ） ===== */
const BGM = {on:false, timer:null, nextT:0, step:0};
const SCALE = [220.0, 261.63, 293.66, 329.63, 392.0, 440.0, 523.25]; // A C D E G A C
const RIFF = [5,-1,4,3, 2,-1,3,2, 0,-1,2,3, 4,-1,3,-1,
              5,-1,4,3, 2,-1,3,4, 6,-1,5,4, 3,-1,2,-1];
const STEP_SEC = 0.30;
function pluck(freq, t, vol){
  if(!S.ac) return;
  const o1 = S.ac.createOscillator(), o2 = S.ac.createOscillator(), g = S.ac.createGain();
  o1.type = "triangle"; o1.frequency.value = freq;
  o2.type = "sine"; o2.frequency.value = freq*2.005;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
  o1.connect(g); o2.connect(g); g.connect(S.ac.destination);
  o1.start(t); o1.stop(t+0.55); o2.start(t); o2.stop(t+0.55);
}
function bgmSchedule(){
  if(!BGM.on || !S.ac) return;
  while(BGM.nextT < S.ac.currentTime + 0.35){
    const idx = RIFF[BGM.step % RIFF.length];
    if(idx >= 0) pluck(SCALE[idx], BGM.nextT, 0.045);
    if(BGM.step % 8 === 0) pluck(110, BGM.nextT, 0.05);
    BGM.step++; BGM.nextT += STEP_SEC;
  }
}
function startBgm(){
  if(!S.bgm || !S.ac || BGM.on) return;
  BGM.on = true; BGM.step = 0; BGM.nextT = S.ac.currentTime + 0.15;
  BGM.timer = setInterval(bgmSchedule, 120);
}
function stopBgm(){
  BGM.on = false;
  if(BGM.timer){ clearInterval(BGM.timer); BGM.timer = null; }
}

function randomPoint(){
  let r = Math.random() * REGION_W_TOTAL;
  let reg = REGIONS[0];
  for(const g of REGIONS){ if(r < g.w){ reg = g; break; } r -= g.w; }
  return {
    lat: reg.latMin + Math.random()*(reg.latMax-reg.latMin),
    lng: reg.lngMin + Math.random()*(reg.lngMax-reg.lngMin)
  };
}

function findPano(attempt){
  if(!S.inGame) return;
  if(attempt > 0){
    $("loadingText").textContent = "青森県内の出題地点を探しています…（" + attempt + "回目）";
  }
  if(attempt > 40){
    const st = S.lastStatus || "応答なし";
    let hint = "通信環境を確認して、ページを再読み込みしてください。";
    if(st !== "ZERO_RESULTS"){
      hint = "APIキー側の問題の可能性があります。請求先アカウントの紐付けと、キーの制限設定を確認してください。";
    }
    $("loadingText").innerHTML = "地点が見つかりませんでした（最後の応答: " + st + "）。<br>"
      + hint + "<br><br><u style='cursor:pointer'>ここをタップで再試行</u>";
    $("loadingText").onclick = ()=>{
      $("loadingText").onclick = null;
      $("loadingText").textContent = "青森県内の出題地点を探しています…";
      findPano(0);
    };
    return;
  }
  S.svService.getPanorama(
    {location: randomPoint(), radius: 3000, source: google.maps.StreetViewSource.OUTDOOR, preference:"nearest"},
    (data, status)=>{
      if(!S.inGame) return;
      S.lastStatus = String(status);
      if(status === "OK" && data && data.location && data.location.latLng){
        const p = data.location.latLng;
        const lat = p.lat(), lng = p.lng();
        if(lat < BOUNDS.latMin || lat > BOUNDS.latMax || lng < BOUNDS.lngMin || lng > BOUNDS.lngMax){
          findPano(attempt+1); return;
        }
        S.answer = {lat, lng};
        S.startPanoId = data.location.pano;
        S.startPov = {heading: Math.random()*360, pitch: 0};
        $("loading").style.display = "none";
        showReady();
      }else{
        findPano(attempt+1);
      }
    }
  );
}

function nextRound(){
  S.round++; S.player = 0;
  S.history.push({dist:[null,null], pts:[0,0]});
  $("loading").style.display = "flex";
  $("loadingText").textContent = "青森県内の出題地点を探しています…";
  show("result", false); show("ready", false); show("game", true);

}

function startTimer(){
  stopTimer();
  if(!S.timeLimit){ $("timerWrap").style.display="none"; return; }
  $("timerWrap").style.display = "block";
  S.timeLeft = S.timeLimit;
  const fill = $("timerFill");
  fill.style.width = "100%"; fill.classList.remove("hurry");
  let lastSec = Math.ceil(S.timeLimit);
  const t0 = Date.now();
  S.timerId = setInterval(()=>{
    S.timeLeft = S.timeLimit - (Date.now()-t0)/1000;
    if(S.timeLeft <= 0){
      fill.style.width = "0%";
      stopTimer();
      timeUp();
      return;
    }
    fill.style.width = (S.timeLeft/S.timeLimit*100) + "%";
    const hurry = S.timeLeft <= 10;
    if(hurry) fill.classList.add("hurry");
    const sec = Math.ceil(S.timeLeft);
    if(sec !== lastSec){ lastSec = sec; sfx.clock(hurry); }
  }, 100);
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId = null; } }

function timeUp(){
  if(S.turnDone) return;
  if(S.guessMarker){ confirmGuess(true); }
  else{ recordResult(null, 0); sfx.bad(); afterTurn(); }
}

/* ===== 回答と採点 ===== */
function haversineKm(a, b){
  const R = 6371, toRad = x => x*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2
          + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function scoreOf(km){
  if(km < 0.05) return 5000;
  return Math.round(5000 * Math.exp(-km/15));
}
function fmtDist(km){
  if(km === null) return "未回答";
  return km < 1 ? Math.round(km*1000) + " m" : (km<10 ? km.toFixed(1) : Math.round(km)) + " km";
}

$("guessBtn").addEventListener("click", ()=> confirmGuess(false));

function confirmGuess(auto){
  if(S.turnDone || !S.guessMarker) return;
  stopTimer();
  const g = {lat:S.guessMarker.getPosition().lat(), lng:S.guessMarker.getPosition().lng()};
  const km = haversineKm(g, S.answer);
  recordResult(g, scoreOf(km), km);
  sfx.confirm();
  afterTurn();
}
function recordResult(guess, pts, km){
  S.turnDone = true;
  const h = S.history[S.round-1];
  h.dist[S.player] = (km===undefined ? null : km);
  h.pts[S.player] = pts;
  h["g"+S.player] = guess;
  S.totals[S.player] += pts;
}
function afterTurn(){
  $("timerWrap").style.display = "none";
  if(S.mode==="duel" && S.player === 0){
    S.player = 1;
    showReady();

    new google.maps.Marker({
      map:m, position:g, title:(S.mode==="duel"? S.names[p] : "あなたの回答"),
      icon:{path:google.maps.SymbolPath.CIRCLE, scale:7, fillColor:colors[p], fillOpacity:1, strokeColor:"#fff", strokeWeight:2}
    });
    animateLine(m, g, S.answer, colors[p], p*400);

  m.fitBounds(bounds, 70);

  const panel = $("resultPanel");
  let html = "";
  for(let p=0; p<nPlayers(); p++){
    const nm = S.mode==="duel" ? esc(S.names[p]) : "距離";
    html += "<div class='scoreRow r" + (p+1) + "'>"
      + "<span class='pn'>" + nm + "</span>"
      + "<span class='dist'>" + fmtDist(h.dist[p]) + "</span>"
      + "<div class='bar'><div class='fill' id='fill" + p + "'></div></div>"
      + "<span class='pts disp' id='pts" + p + "'>0</span>"
      + "</div>";
  }
  html += "<button id='nextBtn'>" + (S.round >= S.rounds ? "最終結果を見る" : "次のラウンドへ") + "</button>";
  panel.innerHTML = html;
  $("nextBtn").addEventListener("click", ()=>{
    if(S.round >= S.rounds){ showFinal(); } else { nextRound(); }
  });

  for(let p=0; p<nPlayers(); p++){
    countUp($("pts"+p), h.pts[p], 900 + p*300, p*300);
    setTimeout(()=>{ $("fill"+p).style.width = (h.pts[p]/5000*100) + "%"; }, 60 + p*300);
    if(h.pts[p] >= 4500) setTimeout(sfx.fanfare, 950 + p*300);
    else if(h.pts[p] === 0) setTimeout(sfx.bad, 400 + p*300);
  }
  updateHud();
}

function animateLine(map, from, to, color, delay){
  const poly = new google.maps.Polyline({
    map, path:[from, from], geodesic:true,
    strokeOpacity:0,
    icons:[{icon:{path:"M 0,-1 0,1", strokeOpacity:1, strokeWeight:2, strokeColor:color}, offset:"0", repeat:"11px"}]
  });
  const dur = 600, t0 = performance.now() + delay;
  function step(now){
    const t = Math.min(1, Math.max(0, (now - t0)/dur));
    const e = 1 - Math.pow(1-t, 3);
    poly.setPath([from, {lat: from.lat + (to.lat-from.lat)*e, lng: from.lng + (to.lng-from.lng)*e}]);
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function countUp(el, target, dur, delay){
  const t0 = performance.now() + delay;
  let lastStep = -1;
  function step(now){
    const t = Math.min(1, Math.max(0, (now - t0)/dur));
    const e = 1 - Math.pow(1-t, 2);
    const v = Math.round(target * e);
    el.textContent = v.toLocaleString();
    const s = Math.floor(v/400);
    if(s !== lastStep){ lastStep = s; if(v>0) sfx.tick(); }
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ===== 紙吹雪 ===== */
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  const cols = ["#d63c35","#f0871f","#3d8bfd","#f5efe0","#5aa66b"];
  const ps = [];
  for(let i=0;i<130;i++){
    ps.push({
      x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*0.5,
      w: 6+Math.random()*7, h: 9+Math.random()*8,
      vy: 2+Math.random()*3, vx: -1+Math.random()*2,
      rot: Math.random()*Math.PI, vr: -0.12+Math.random()*0.24,
      c: cols[i%cols.length]
    });
  }
  const t0 = performance.now();
  function frame(now){
    ctx.clearRect(0,0,cv.width,cv.height);
    const life = (now-t0)/3200;
    for(const p of ps){
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - life*1.1);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if(life < 1){ requestAnimationFrame(frame); }
    else{ cv.style.display = "none"; }
  }
  requestAnimationFrame(frame);
}

/* ===== 最終結果 ===== */
function showFinal(){
  show("result", false); show("game", false); show("final", true);
  stopBgm();
  const max = S.rounds * 5000;
  let celebrate = false;
  if(S.mode==="duel"){
    let msg, crown = "👑";
    if(S.totals[0] > S.totals[1]){ msg = esc(S.names[0]) + " の勝ち！"; celebrate = true; }
    else if(S.totals[1] > S.totals[0]){ msg = esc(S.names[1]) + " の勝ち！"; celebrate = true; }
    else{ msg = "引き分け！"; crown = "🤝"; }
    $("crown").textContent = crown;
    $("winner").innerHTML = msg;
    $("finalTotals").innerHTML =
      "<div class='t1'>" + esc(S.names[0]) + "<b>" + S.totals[0].toLocaleString() + "</b></div>" +
      "<div class='t2'>" + esc(S.names[1]) + "<b>" + S.totals[1].toLocaleString() + "</b></div>";
    $("finalList").innerHTML = S.history.map((h,i)=>
      "<div><span>R" + (i+1) + "</span>" +
      "<span style='color:var(--p1-soft)'>" + fmtDist(h.dist[0]) + "　" + h.pts[0].toLocaleString() + "pt</span>" +
      "<span style='color:var(--p2-soft)'>" + fmtDist(h.dist[1]) + "　" + h.pts[1].toLocaleString() + "pt</span></div>"
    ).join("");
    sfx.win();
  }else{
    celebrate = S.totals[0] >= max*0.8;
    $("crown").textContent = celebrate ? "🏆" : "🍎";
    $("winner").innerHTML = S.totals[0].toLocaleString() + "<small style='font-size:16px'> / " + max.toLocaleString() + " pt</small>";
    $("finalTotals").innerHTML = "";
    $("finalList").innerHTML = S.history.map((h,i)=>
      "<div><span>ラウンド " + (i+1) + "</span><span>" + fmtDist(h.dist[0]) + "　" + h.pts[0].toLocaleString() + " pt</span></div>"
    ).join("");
    if(celebrate) sfx.win();
  }
  if(celebrate) confetti();
}
