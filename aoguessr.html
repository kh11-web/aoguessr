<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AoGuessr - アオゲッサー</title>
<style>
  :root{
    --forest:#0e2a23;
    --forest-2:#173d33;
    --cream:#f2ede2;
    --apple:#c8302e;
    --apple-dark:#a52321;
    --p1:#1a73e8;   /* プレイヤー1 青 */
    --p2:#e8710a;   /* プレイヤー2 橙 */
    --line:rgba(242,237,226,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    background:var(--forest);color:var(--cream);
  }
  button{font-family:inherit;cursor:pointer;border:none}

  /* ---------- 起動画面 ---------- */
  #setup{
    min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:32px 20px;
  }
  #setup h1{
    font-size:clamp(44px,10vw,76px);font-weight:800;letter-spacing:.02em;
    line-height:1.05;text-align:center;
  }
  #setup h1 span{color:#e0524f}
  #setup .sub{margin-top:8px;font-size:14px;opacity:.85;text-align:center;letter-spacing:.3em}
  .panel{
    margin-top:30px;width:min(460px,100%);
    background:var(--forest-2);border:1px solid var(--line);border-radius:10px;
    padding:22px 20px;display:flex;flex-direction:column;gap:16px;
  }
  .field label{display:block;font-size:13px;margin-bottom:6px;opacity:.9}
  .field input[type=text]{
    width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);
    background:#0b211b;color:var(--cream);font-size:14px;
  }
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-size:14px;
  }
  .chip.on{background:var(--cream);color:var(--forest);font-weight:700;border-color:var(--cream)}
  #nameFields{display:none;gap:10px}
  #nameFields input{flex:1;min-width:0}
  #startBtn{
    margin-top:4px;padding:14px;border-radius:8px;background:var(--apple);
    color:#fff;font-size:17px;font-weight:700;letter-spacing:.08em;
  }
  #startBtn:hover{background:var(--apple-dark)}
  #startBtn:disabled{opacity:.5;cursor:wait}
  #setupErr{display:none;color:#ffb3b1;font-size:13px;line-height:1.6}
  .note{margin-top:20px;font-size:12px;opacity:.65;line-height:1.8;width:min(460px,100%)}

  /* ---------- ゲーム画面 ---------- */
  #game{position:fixed;inset:0;display:none}
  #pano{position:absolute;inset:0}
  #timerWrap{position:absolute;top:0;left:0;right:0;height:6px;z-index:6;background:rgba(0,0,0,.35);display:none}
  #timerFill{height:100%;width:100%;background:var(--cream)}
  #timerFill.hurry{background:var(--apple)}
  #hud{
    position:absolute;top:14px;left:12px;z-index:5;
    background:rgba(14,42,35,.88);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    max-width:calc(100vw - 130px);
  }
  #hud b{font-size:15px}
  .hudP1{color:#8db8f5}.hudP2{color:#f5b47c}
  #topRight{position:absolute;top:14px;right:12px;z-index:5;display:flex;gap:8px}
  #topRight button{
    background:rgba(14,42,35,.88);border:1px solid var(--line);border-radius:8px;
    color:var(--cream);padding:8px 12px;font-size:13px;
  }
  #mapBox{
    position:absolute;right:12px;bottom:12px;z-index:5;
    width:250px;height:190px;border-radius:10px;overflow:hidden;
    border:2px solid rgba(14,42,35,.9);box-shadow:0 4px 18px rgba(0,0,0,.45);
    transition:width .18s ease,height .18s ease;
    display:flex;flex-direction:column;background:var(--forest-2);
  }
  #mapBox.big{width:min(78vw,640px);height:min(60vh,480px)}
  #guessMap{flex:1}
  #sizeBtn{
    position:absolute;top:6px;left:6px;z-index:6;width:30px;height:30px;
    border-radius:6px;background:rgba(14,42,35,.88);color:var(--cream);font-size:15px;
  }
  #guessBtn{
    height:44px;background:var(--apple);color:#fff;font-size:15px;font-weight:700;letter-spacing:.06em;
  }
  #guessBtn:disabled{background:#4c5a56;color:#c7cdc9;cursor:default}
  #loading{
    position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:var(--forest);font-size:15px;letter-spacing:.05em;text-align:center;padding:20px;line-height:2;
  }

  /* ---------- 交代・スタート画面 ---------- */
  #ready{
    position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:var(--forest);padding:24px;text-align:center;
  }
  #readyRound{font-size:15px;letter-spacing:.15em;opacity:.8}
  #readyName{font-size:34px;font-weight:800}
  #readyName.c1{color:#8db8f5}#readyName.c2{color:#f5b47c}
  #readyNote{font-size:13px;opacity:.75;line-height:1.9}
  #readyBtn{
    margin-top:10px;padding:14px 56px;border-radius:8px;background:var(--apple);
    color:#fff;font-size:17px;font-weight:700;letter-spacing:.1em;
  }

  /* ---------- ラウンド結果 ---------- */
  #result{position:fixed;inset:0;display:none;flex-direction:column;background:var(--forest)}
  #resultMap{flex:1}
  #resultPanel{
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .scoreRow{
    width:min(440px,100%);display:flex;align-items:center;gap:10px;font-size:14px;
  }
  .scoreRow .pn{width:6.5em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scoreRow.r1 .pn{color:#8db8f5}.scoreRow.r2 .pn{color:#f5b47c}
  .scoreRow .dist{width:6em;text-align:right;opacity:.9}
  .scoreRow .bar{flex:1;height:8px;border-radius:4px;background:#0b211b;overflow:hidden}
  .scoreRow .fill{height:100%;width:0;background:var(--apple);transition:width .8s ease}
  .scoreRow.r1 .fill{background:var(--p1)}
  .scoreRow.r2 .fill{background:var(--p2)}
  .scoreRow .pts{width:4.6em;text-align:right;font-weight:800;font-size:16px}
  #nextBtn{
    margin-top:8px;padding:12px 44px;border-radius:8px;background:var(--cream);
    color:var(--forest);font-size:16px;font-weight:700;
  }

  /* ---------- 最終結果 ---------- */
  #final{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:var(--forest);padding:24px;overflow:auto;
  }
  #final h2{font-size:18px;letter-spacing:.15em;font-weight:600;opacity:.85}
  #winner{font-size:30px;font-weight:800;text-align:center;line-height:1.4}
  #finalTotals{display:flex;gap:28px;font-size:16px;text-align:center}
  #finalTotals b{display:block;font-size:34px;font-weight:800}
  #finalTotals .t1 b{color:#8db8f5}#finalTotals .t2 b{color:#f5b47c}
  #finalList{width:min(460px,100%);border-top:1px solid var(--line);font-size:13px}
  #finalList div{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line)}
  #againBtn{
    padding:13px 48px;border-radius:8px;background:var(--apple);color:#fff;
    font-size:16px;font-weight:700;letter-spacing:.06em;
  }
  @media (max-width:640px){
    #mapBox{width:170px;height:150px}
    #mapBox.big{width:calc(100vw - 24px);height:52vh}
    #hud{font-size:11px;padding:7px 10px;gap:8px}
    #hud b{font-size:13px}
    .scoreRow .pn{width:5em}
  }
</style>
</head>
<body>

<!-- 起動画面 -->
<div id="setup">
  <h1><span>Ao</span>Guessr</h1>
  <p class="sub">アオゲッサー</p>
  <div class="panel">
    <div class="field">
      <label for="keyInput">Google Maps APIキー</label>
      <input type="text" id="keyInput" placeholder="AIza..." autocomplete="off">
    </div>
    <div class="field">
      <label>あそびかた</label>
      <div class="row" id="modeChips">
        <button class="chip on" data-mode="solo">ひとりで</button>
        <button class="chip" data-mode="duel">ふたりで対戦</button>
      </div>
    </div>
    <div class="field" id="nameFieldWrap" style="display:none">
      <label>プレイヤー名</label>
      <div class="row" id="nameFields" style="display:flex">
        <input type="text" id="name1" placeholder="プレイヤー1" maxlength="8">
        <input type="text" id="name2" placeholder="プレイヤー2" maxlength="8">
      </div>
    </div>
    <div class="field">
      <label>ラウンド数</label>
      <div class="row" id="roundChips">
        <button class="chip" data-r="3">3</button>
        <button class="chip on" data-r="5">5</button>
        <button class="chip" data-r="10">10</button>
      </div>
    </div>
    <div class="field">
      <label>制限時間（1人あたり）</label>
      <div class="row" id="timeChips">
        <button class="chip on" data-t="0">なし</button>
        <button class="chip" data-t="30">30秒</button>
        <button class="chip" data-t="60">60秒</button>
        <button class="chip" data-t="120">2分</button>
      </div>
    </div>
    <div class="field">
      <label>移動</label>
      <div class="row" id="moveChips">
        <button class="chip on" data-m="1">移動あり</button>
        <button class="chip" data-m="0">その場から動けない</button>
      </div>
    </div>
    <button id="startBtn">プレイ開始</button>
    <p id="setupErr"></p>
  </div>
  <p class="note">
    青森県内のどこかに降り立ち、景色を手がかりに地図で場所を当てるゲームです。
    1ラウンド最大5,000pt。対戦では同じ地点を2人が順番にプレイし、合計点で勝負します。
    APIキーはこの端末のブラウザ内にだけ保存され、外部には送信されません。
  </p>
</div>

<!-- ゲーム画面 -->
<div id="game">
  <div id="pano"></div>
  <div id="timerWrap"><div id="timerFill"></div></div>
  <div id="hud"></div>
  <div id="topRight">
    <button id="soundBtn" title="効果音">♪ ON</button>
    <button id="backBtn">出発地点に戻る</button>
  </div>
  <div id="mapBox">
    <button id="sizeBtn" title="地図の拡大/縮小">⤢</button>
    <div id="guessMap"></div>
    <button id="guessBtn" disabled>地図をタップして回答</button>
  </div>
  <div id="loading">青森県内の出題地点を探しています…</div>
</div>

<!-- 交代・スタート画面 -->
<div id="ready">
  <div id="readyRound"></div>
  <div id="readyName"></div>
  <p id="readyNote"></p>
  <button id="readyBtn">スタート</button>
</div>

<!-- ラウンド結果 -->
<div id="result">
  <div id="resultMap"></div>
  <div id="resultPanel"></div>
</div>

<!-- 最終結果 -->
<div id="final">
  <h2>最終結果</h2>
  <div id="winner"></div>
  <div id="finalTotals"></div>
  <div id="finalList"></div>
  <button id="againBtn">もう一度あそぶ</button>
</div>

<script>
"use strict";

/* ▼▼ 公開用設定 ▼▼
   GitHubに置くときは、下の "" の間にAPIキーを貼り付けてください。
   例: const EMBEDDED_KEY = "AIzaXXXXXXXX";
   ここが空のままなら、起動画面でキーを入力する方式で動きます。 */
const EMBEDDED_KEY = "";
/* ▲▲ 書き換えるのはここだけです ▲▲ */

/* ===== 出題エリア（青森県の陸地をおおまかに覆う矩形群。海・県外は引き直し） ===== */
const REGIONS = [
  {latMin:40.60, latMax:41.15, lngMin:140.05, lngMax:140.60, w:3}, // 津軽平野・西海岸
  {latMin:40.60, latMax:41.00, lngMin:140.60, lngMax:141.05, w:3}, // 青森市・東津軽
  {latMin:40.35, latMax:40.95, lngMin:141.05, lngMax:141.60, w:4}, // 八戸・十和田・三沢・上北
  {latMin:41.15, latMax:41.45, lngMin:140.95, lngMax:141.40, w:2}, // 下北半島
  {latMin:40.40, latMax:40.60, lngMin:140.75, lngMax:141.05, w:1}, // 十和田湖・奥入瀬方面
  {latMin:41.00, latMax:41.30, lngMin:140.30, lngMax:140.70, w:1}  // 五所川原北部・竜飛方面
];
const REGION_W_TOTAL = REGIONS.reduce((s,r)=>s+r.w,0);
const BOUNDS = {latMin:40.20, latMax:41.60, lngMin:139.80, lngMax:141.75};

/* ===== 状態 ===== */
const S = {
  key:"", rounds:5, allowMove:true, timeLimit:0, mode:"solo",
  names:["プレイヤー1","プレイヤー2"], sound:true,
  round:0, player:0, totals:[0,0], history:[],
  panorama:null, guessMap:null, guessMarker:null,
  answer:null, startPanoId:null, startPov:null,
  svService:null, mapsReady:false, lastStatus:null,
  timerId:null, timeLeft:0, turnDone:false, ac:null
};
const nPlayers = ()=> S.mode==="duel" ? 2 : 1;

const $ = id => document.getElementById(id);
const show = (id,on)=>{ $(id).style.display = on ? (id==="game" ? "block" : "flex") : "none"; };

/* ===== 効果音（WebAudio・外部ファイル不要） ===== */
function ensureAudio(){
  if(!S.ac){
    try{ S.ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(S.ac && S.ac.state === "suspended") S.ac.resume();
}
function beep(freq, dur, delay, type, vol){
  if(!S.sound || !S.ac) return;
  const t = S.ac.currentTime + (delay||0);
  const o = S.ac.createOscillator(), g = S.ac.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(S.ac.destination);
  o.start(t); o.stop(t+dur);
}
const sfx = {
  start:  ()=>{ beep(440,.12,0,"triangle"); beep(660,.15,.10,"triangle"); },
  confirm:()=>{ beep(660,.09,0,"square",.08); beep(880,.14,.08,"square",.08); },
  tick:   ()=> beep(1200,.03,0,"square",.05),
  hurry:  ()=> beep(880,.05,0,"square",.06),
  fanfare:()=>{ [523,659,784,1047].forEach((f,i)=> beep(f,.22,i*.13,"triangle",.14)); },
  bad:    ()=> beep(170,.35,0,"sawtooth",.10),
  win:    ()=>{ [392,523,659,784,1047].forEach((f,i)=> beep(f,.25,i*.14,"triangle",.14)); }
};

/* ===== 起動画面 ===== */
try{
  const saved = localStorage.getItem("aoguessrKey") || localStorage.getItem("aomoriGuesserKey");
  if(saved) $("keyInput").value = saved;
  if(localStorage.getItem("aoguessrMute")==="1"){ S.sound=false; }
}catch(e){}
if(EMBEDDED_KEY){ $("keyInput").parentElement.style.display = "none"; }

function bindChips(boxId, cb){
  $(boxId).addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    [...$(boxId).children].forEach(c=>c.classList.remove("on"));
    b.classList.add("on"); cb(b);
  });
}
bindChips("roundChips", b=>{ S.rounds = +b.dataset.r; });
bindChips("timeChips",  b=>{ S.timeLimit = +b.dataset.t; });
bindChips("moveChips",  b=>{ S.allowMove = b.dataset.m==="1"; });
bindChips("modeChips",  b=>{
  S.mode = b.dataset.mode;
  $("nameFieldWrap").style.display = S.mode==="duel" ? "block" : "none";
});

function setupError(msg){
  const el = $("setupErr");
  el.textContent = msg; el.style.display = "block";
  $("startBtn").disabled = false; $("startBtn").textContent = "プレイ開始";
}

$("startBtn").addEventListener("click", ()=>{
  const key = EMBEDDED_KEY || $("keyInput").value.trim();
  if(!key){ setupError("APIキーを入力してください。"); return; }
  ensureAudio();
  S.names[0] = $("name1").value.trim() || "プレイヤー1";
  S.names[1] = $("name2").value.trim() || "プレイヤー2";
  $("setupErr").style.display = "none";
  $("startBtn").disabled = true; $("startBtn").textContent = "読み込み中…";
  if(!EMBEDDED_KEY){ try{ localStorage.setItem("aoguessrKey", key); }catch(e){} }

  if(S.mapsReady){
    if(key !== S.key){
      setupError("キーを変更した場合はページを再読み込みしてから開始してください。");
      return;
    }
    beginGame(); return;
  }
  S.key = key;
  const sc = document.createElement("script");
  sc.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key)
         + "&language=ja&region=JP&callback=__mapsInit";
  sc.onerror = ()=> setupError("Google Mapsの読み込みに失敗しました。通信環境とキーを確認してください。");
  document.head.appendChild(sc);
});

window.gm_authFailure = function(){
  ["game","ready","result","final"].forEach(id=>show(id,false));
  show("setup", true);
  setupError("APIキーが認証されませんでした。キーの値と、Maps JavaScript APIが有効になっているかを確認してください。");
};

window.__mapsInit = function(){
  S.mapsReady = true;
  S.svService = new google.maps.StreetViewService();
  beginGame();
};

/* ===== ゲーム進行 ===== */
function beginGame(){
  S.round = 0; S.totals = [0,0]; S.history = [];
  updateSoundBtn();
  show("setup", false); show("final", false); show("result", false); show("ready", false);
  show("game", true);
  if(!S.guessMap) buildGuessMap();
  nextRound();
}

function buildGuessMap(){
  S.guessMap = new google.maps.Map($("guessMap"), {
    center:{lat:40.85, lng:140.85}, zoom:8, minZoom:7,
    restriction:{latLngBounds:{north:42.1, south:39.6, west:139.0, east:142.6}},
    streetViewControl:false, fullscreenControl:false, mapTypeControl:false,
    clickableIcons:false, draggableCursor:"crosshair", gestureHandling:"greedy"
  });
  S.guessMap.addListener("click", e=>{
    if(S.turnDone) return;
    if(!S.guessMarker){
      S.guessMarker = new google.maps.Marker({map:S.guessMap, position:e.latLng});
    }else{
      S.guessMarker.setPosition(e.latLng);
    }
    const btn = $("guessBtn");
    btn.disabled = false; btn.textContent = "ここで回答する";
  });
}

function randomPoint(){
  let r = Math.random() * REGION_W_TOTAL;
  let reg = REGIONS[0];
  for(const g of REGIONS){ if(r < g.w){ reg = g; break; } r -= g.w; }
  return {
    lat: reg.latMin + Math.random()*(reg.latMax-reg.latMin),
    lng: reg.lngMin + Math.random()*(reg.lngMax-reg.lngMin)
  };
}

function findPano(attempt){
  if(attempt > 0){
    $("loading").textContent = "青森県内の出題地点を探しています…（" + attempt + "回目）";
  }
  if(attempt > 40){
    const st = S.lastStatus || "応答なし";
    let hint = "通信環境を確認して、ページを再読み込みしてください。";
    if(st !== "ZERO_RESULTS"){
      hint = "APIキー側の問題の可能性があります。請求先アカウントの紐付けと、キーの制限が「Maps JavaScript API」になっているかを確認してください。";
    }
    $("loading").innerHTML = "地点が見つかりませんでした（最後の応答: " + st + "）。<br>"
      + hint + "<br><br><u style='cursor:pointer'>ここをタップで再試行</u>";
    $("loading").onclick = ()=>{
      $("loading").onclick = null;
      $("loading").textContent = "青森県内の出題地点を探しています…";
      findPano(0);
    };
    return;
  }
  S.svService.getPanorama(
    {location: randomPoint(), radius: 3000, source: google.maps.StreetViewSource.OUTDOOR, preference:"nearest"},
    (data, status)=>{
      S.lastStatus = String(status);
      if(status === "OK" && data && data.location && data.location.latLng){
        const p = data.location.latLng;
        const lat = p.lat(), lng = p.lng();
        if(lat < BOUNDS.latMin || lat > BOUNDS.latMax || lng < BOUNDS.lngMin || lng > BOUNDS.lngMax){
          findPano(attempt+1); return;
        }
        S.answer = {lat, lng};
        S.startPanoId = data.location.pano;
        S.startPov = {heading: Math.random()*360, pitch: 0};
        $("loading").style.display = "none";
        showReady();
      }else{
        findPano(attempt+1);
      }
    }
  );
}

function nextRound(){
  S.round++; S.player = 0;
  S.history.push({dist:[null,null], pts:[0,0]});
  $("loading").style.display = "flex";
  $("loading").textContent = "青森県内の出題地点を探しています…";
  show("result", false); show("ready", false); show("game", true);
  findPano(0);
}

/* ===== スタート・交代画面 ===== */
function showReady(){
  // ひとりプレイで制限時間なしなら、確認画面を挟まず即開始
  if(S.mode==="solo" && S.timeLimit===0){ startTurn(); return; }
  $("readyRound").textContent = "ラウンド " + S.round + " / " + S.rounds;
  if(S.mode==="duel"){
    $("readyName").textContent = S.names[S.player] + " の番";
    $("readyName").className = S.player===0 ? "c1" : "c2";
    $("readyNote").innerHTML = (S.player===1 ? "同じ地点に降り立ちます。" : "") +
      "プレイ中はもう1人は画面を見ないでください。" +
      (S.timeLimit ? "<br>スタートを押すと制限時間" + fmtLimit() + "が始まります。" : "");
  }else{
    $("readyName").textContent = "";
    $("readyName").className = "";
    $("readyNote").textContent = "スタートを押すと制限時間" + fmtLimit() + "が始まります。";
  }
  show("game", false); show("ready", true);
}
function fmtLimit(){ return S.timeLimit>=60 ? (S.timeLimit/60)+"分" : S.timeLimit+"秒"; }

$("readyBtn").addEventListener("click", ()=>{ ensureAudio(); show("ready", false); startTurn(); });

function startTurn(){
  S.turnDone = false;
  show("game", true);
  const opts = {
    pano: S.startPanoId, pov: {heading:S.startPov.heading, pitch:S.startPov.pitch}, zoom: 0,
    addressControl:false, showRoadLabels:false,
    fullscreenControl:false, motionTracking:false, motionTrackingControl:false,
    clickToGo: S.allowMove, linksControl: S.allowMove,
    zoomControl:true, enableCloseButton:false
  };
  if(!S.panorama){
    S.panorama = new google.maps.StreetViewPanorama($("pano"), opts);
  }else{
    S.panorama.setOptions(opts);
    S.panorama.setPano(S.startPanoId);
    S.panorama.setPov({heading:S.startPov.heading, pitch:S.startPov.pitch});
    S.panorama.setZoom(0);
  }
  if(S.guessMarker){ S.guessMarker.setMap(null); S.guessMarker = null; }
  const btn = $("guessBtn");
  btn.disabled = true; btn.textContent = "地図をタップして回答";
  $("mapBox").classList.remove("big");
  S.guessMap.setCenter({lat:40.85, lng:140.85});
  S.guessMap.setZoom(8);
  updateHud();
  sfx.start();
  startTimer();
}

function updateHud(){
  let h = "<span>ラウンド <b>" + S.round + "</b> / " + S.rounds + "</span>";
  if(S.mode==="duel"){
    h += "<span class='hudP1'>" + S.names[0] + " <b>" + S.totals[0].toLocaleString() + "</b></span>";
    h += "<span class='hudP2'>" + S.names[1] + " <b>" + S.totals[1].toLocaleString() + "</b></span>";
  }else{
    h += "<span>合計 <b>" + S.totals[0].toLocaleString() + "</b> pt</span>";
  }
  $("hud").innerHTML = h;
}

/* ===== タイマー ===== */
function startTimer(){
  stopTimer();
  if(!S.timeLimit){ $("timerWrap").style.display="none"; return; }
  $("timerWrap").style.display = "block";
  S.timeLeft = S.timeLimit;
  const fill = $("timerFill");
  fill.style.width = "100%"; fill.classList.remove("hurry");
  let lastTickSec = Math.ceil(S.timeLeft);
  const t0 = Date.now();
  S.timerId = setInterval(()=>{
    S.timeLeft = S.timeLimit - (Date.now()-t0)/1000;
    if(S.timeLeft <= 0){
      fill.style.width = "0%";
      stopTimer();
      timeUp();
      return;
    }
    fill.style.width = (S.timeLeft/S.timeLimit*100) + "%";
    if(S.timeLeft <= 10) fill.classList.add("hurry");
    const sec = Math.ceil(S.timeLeft);
    if(sec !== lastTickSec){ lastTickSec = sec; if(sec <= 5) sfx.hurry(); }
  }, 100);
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId = null; } }

function timeUp(){
  if(S.turnDone) return;
  if(S.guessMarker){ confirmGuess(true); }      // マーカーがあればその位置で自動確定
  else{ recordResult(null, 0); sfx.bad(); afterTurn(); }  // 未回答は0pt
}

/* ===== 回答と採点 ===== */
function haversineKm(a, b){
  const R = 6371, toRad = x => x*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2
          + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function scoreOf(km){
  if(km < 0.05) return 5000;
  return Math.round(5000 * Math.exp(-km/15));
}
function fmtDist(km){
  if(km === null) return "未回答";
  return km < 1 ? Math.round(km*1000) + " m" : (km<10 ? km.toFixed(1) : Math.round(km)) + " km";
}

$("guessBtn").addEventListener("click", ()=>{ if(!S.guessBtnLock) confirmGuess(false); });

function confirmGuess(auto){
  if(S.turnDone || !S.guessMarker) return;
  stopTimer();
  const g = {lat:S.guessMarker.getPosition().lat(), lng:S.guessMarker.getPosition().lng()};
  const km = haversineKm(g, S.answer);
  recordResult(g, scoreOf(km), km);
  sfx.confirm();
  afterTurn();
}
function recordResult(guess, pts, km){
  S.turnDone = true;
  const h = S.history[S.round-1];
  h.dist[S.player] = (km===undefined ? null : km);
  h.pts[S.player] = pts;
  h["g"+S.player] = guess;
  S.totals[S.player] += pts;
}
function afterTurn(){
  $("timerWrap").style.display = "none";
  if(S.mode==="duel" && S.player === 0){
    S.player = 1;
    showReady();          // 結果を見せずに交代画面へ
  }else{
    showRoundResult();
  }
}

/* ===== ラウンド結果（演出つき） ===== */
function showRoundResult(){
  show("game", false); show("ready", false); show("result", true);
  const h = S.history[S.round-1];
  const m = new google.maps.Map($("resultMap"), {
    center:S.answer, zoom:9,
    streetViewControl:false, fullscreenControl:false, mapTypeControl:false, clickableIcons:false
  });
  new google.maps.Marker({map:m, position:S.answer, title:"正解地点"});
  const bounds = new google.maps.LatLngBounds();
  bounds.extend(S.answer);

  const colors = ["#1a73e8","#e8710a"];
  for(let p=0; p<nPlayers(); p++){
    const g = h["g"+p];
    if(!g) continue;
    bounds.extend(g);
    new google.maps.Marker({
      map:m, position:g, title:(S.mode==="duel"? S.names[p] : "あなたの回答"),
      icon:{path:google.maps.SymbolPath.CIRCLE, scale:7, fillColor:colors[p], fillOpacity:1, strokeColor:"#fff", strokeWeight:2}
    });
    animateLine(m, g, S.answer, colors[p], p*400);
  }
  m.fitBounds(bounds, 70);

  // スコアパネル
  const panel = $("resultPanel");
  let html = "";
  for(let p=0; p<nPlayers(); p++){
    const nm = S.mode==="duel" ? S.names[p] : "距離";
    html += "<div class='scoreRow r" + (p+1) + "'>"
      + "<span class='pn'>" + nm + "</span>"
      + "<span class='dist'>" + fmtDist(h.dist[p]) + "</span>"
      + "<div class='bar'><div class='fill' id='fill" + p + "'></div></div>"
      + "<span class='pts' id='pts" + p + "'>0</span>"
      + "</div>";
  }
  html += "<button id='nextBtn'>" + (S.round >= S.rounds ? "最終結果を見る" : "次のラウンドへ") + "</button>";
  panel.innerHTML = html;
  $("nextBtn").addEventListener("click", ()=>{
    if(S.round >= S.rounds){ showFinal(); } else { nextRound(); }
  });

  // スコア巻き上げ演出
  for(let p=0; p<nPlayers(); p++){
    countUp($("pts"+p), h.pts[p], 900 + p*300, p*300);
    setTimeout(()=>{ $("fill"+p).style.width = (h.pts[p]/5000*100) + "%"; }, 60 + p*300);
    if(h.pts[p] >= 4500) setTimeout(sfx.fanfare, 950 + p*300);
    else if(h.pts[p] === 0) setTimeout(sfx.bad, 400 + p*300);
  }
  updateHud();
}

function animateLine(map, from, to, color, delay){
  const poly = new google.maps.Polyline({
    map, path:[from, from], geodesic:true,
    strokeOpacity:0,
    icons:[{icon:{path:"M 0,-1 0,1", strokeOpacity:1, strokeWeight:2, strokeColor:color}, offset:"0", repeat:"11px"}]
  });
  const dur = 600, t0 = performance.now() + delay;
  function step(now){
    const t = Math.min(1, Math.max(0, (now - t0)/dur));
    const e = 1 - Math.pow(1-t, 3);
    poly.setPath([from, {lat: from.lat + (to.lat-from.lat)*e, lng: from.lng + (to.lng-from.lng)*e}]);
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function countUp(el, target, dur, delay){
  const t0 = performance.now() + delay;
  let lastStep = -1;
  function step(now){
    const t = Math.min(1, Math.max(0, (now - t0)/dur));
    const e = 1 - Math.pow(1-t, 2);
    const v = Math.round(target * e);
    el.textContent = v.toLocaleString();
    const s = Math.floor(v/400);
    if(s !== lastStep){ lastStep = s; if(v>0) sfx.tick(); }
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ===== 最終結果 ===== */
function showFinal(){
  show("result", false); show("game", false); show("final", true);
  const max = S.rounds * 5000;
  if(S.mode==="duel"){
    let msg;
    if(S.totals[0] > S.totals[1]){ msg = S.names[0] + " の勝ち！"; }
    else if(S.totals[1] > S.totals[0]){ msg = S.names[1] + " の勝ち！"; }
    else{ msg = "引き分け！"; }
    $("winner").textContent = msg;
    $("finalTotals").innerHTML =
      "<div class='t1'>" + S.names[0] + "<b>" + S.totals[0].toLocaleString() + "</b></div>" +
      "<div class='t2'>" + S.names[1] + "<b>" + S.totals[1].toLocaleString() + "</b></div>";
    $("finalList").innerHTML = S.history.map((h,i)=>
      "<div><span>R" + (i+1) + "</span>" +
      "<span style='color:#8db8f5'>" + fmtDist(h.dist[0]) + "　" + h.pts[0].toLocaleString() + "pt</span>" +
      "<span style='color:#f5b47c'>" + fmtDist(h.dist[1]) + "　" + h.pts[1].toLocaleString() + "pt</span></div>"
    ).join("");
    sfx.win();
  }else{
    $("winner").innerHTML = S.totals[0].toLocaleString() + "<small style='font-size:16px'> / " + max.toLocaleString() + " pt</small>";
    $("finalTotals").innerHTML = "";
    $("finalList").innerHTML = S.history.map((h,i)=>
      "<div><span>ラウンド " + (i+1) + "</span><span>" + fmtDist(h.dist[0]) + "　" + h.pts[0].toLocaleString() + " pt</span></div>"
    ).join("");
    if(S.totals[0] >= max*0.8) sfx.win();
  }
}
$("againBtn").addEventListener("click", beginGame);

/* ===== その他ボタン ===== */
$("backBtn").addEventListener("click", ()=>{
  if(S.startPanoId && S.panorama){
    S.panorama.setPano(S.startPanoId);
    S.panorama.setPov({heading:S.startPov.heading, pitch:S.startPov.pitch});
    S.panorama.setZoom(0);
  }
});
$("sizeBtn").addEventListener("click", ()=> $("mapBox").classList.toggle("big"));
function updateSoundBtn(){ $("soundBtn").textContent = S.sound ? "♪ ON" : "♪ OFF"; }
$("soundBtn").addEventListener("click", ()=>{
  S.sound = !S.sound; updateSoundBtn(); ensureAudio();
  try{ localStorage.setItem("aoguessrMute", S.sound ? "0" : "1"); }catch(e){}
  if(S.sound) sfx.confirm();
});
</script>
